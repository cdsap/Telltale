name: 'Experiment Runner with Gradle Profiler'
description: 'Executes a scenario defined with Gradle Profiler'

inputs:
  task:
    description: 'Gradle task to execute in the scenario'
    required: true
  warmups:
    description: 'Number of build warmups before measuring performance'
    required: false
    default: 1
  iterations:
    description: 'Number of iterations to run for performance measurement'
    required: false
    default: 5
  class:
    description: 'Class to apply the ABI change, if applicable'
    required: false
  variant:
    description: 'Branch or variant of the experiment'
    required: true
  variant-prefix:
    description: 'Prefix for the variant used in tagging'
    required: true
  experiment-id:
    description: 'Unique identifier for the experiment'
    required: true
  api-key:
    description: 'API key for accessing Develocity or related services'
    required: true
  repository:
    description: 'GitHub repository to check out'
    required: true
  jdk_version:
    description: 'Java version to use (default is 17)'
    required: true
    default: 17
  jdk_vendor:
    description: 'JDK vendor to use (default is zulu)'
    required: true
    default: 'zulu'
  extra-args:
    description: 'Extra arguments to pass to the Gradle command'
    required: true
  configuration-cache:
    description: 'Gradle configuration cache behavior: off, disabled, on, warn, or read-only.'
    required: false
    default: 'off'
  project-isolation:
    description: 'Gradle Isolated Projects behavior: off, on, or diagnostics.'
    required: false
    default: 'off'
  cache-url:
    description: 'URL for the cache node, if applicable'
    required: true
  clean-between-iterations:
    description: 'Run clean between profiler iterations (set false to profile incremental builds)'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.variant }}

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.jdk_vendor }}
        java-version: ${{ inputs.jdk_version }}

    - name: Setup Gradle Profiler
      uses: sdkman/sdkman-action@master
      id: sdkman
      with:
        candidate: gradleprofiler
        version: 0.23.0

    - uses: cdsap/build-process-watcher@v0.6.2
      with:
        remote_monitoring: 'true'          
        export_to_bigquery: 'true'
    
    - name: Execute Gradle Build with Profiler
      id: geapix
      run: |
        unzip ${{ steps.sdkman.outputs.file }}
        EXTRA_ARG=""

        # Set EXTRA_ARG based on the provided input
        if [ -z "${{ inputs.extra-args }}" ] || [ -z "$(echo "${{ inputs.extra-args }}" | tr -d '[:space:]')" ]; then
          EXTRA_ARG="-Pfoo"
        else
          EXTRA_ARG="${{ inputs.extra-args }}"
        fi

        case "${{ inputs.configuration-cache }}" in
          "off"|"")
            CONFIGURATION_CACHE_ARGS=()
            ;;
          "disabled")
            CONFIGURATION_CACHE_ARGS=("--no-configuration-cache")
            ;;
          "on")
            CONFIGURATION_CACHE_ARGS=("--configuration-cache")
            ;;
          "warn")
            CONFIGURATION_CACHE_ARGS=("--configuration-cache" "--configuration-cache-problems=warn")
            ;;
          "read-only")
            CONFIGURATION_CACHE_ARGS=("--configuration-cache" "-Dorg.gradle.configuration-cache.read-only=true")
            ;;
          *)
            echo "Unknown configuration cache option: ${{ inputs.configuration-cache }}"
            exit 1
            ;;
        esac

        case "${{ inputs.project-isolation }}" in
          "off"|"")
            PROJECT_ISOLATION_ARGS=()
            ;;
          "on")
            PROJECT_ISOLATION_ARGS=("--isolated-projects")
            ;;
          "diagnostics")
            PROJECT_ISOLATION_ARGS=("--isolated-projects" "-Dorg.gradle.unsafe.isolated-projects.diagnostics=true")
            ;;
          *)
            echo "Unknown project isolation option: ${{ inputs.project-isolation }}"
            exit 1
            ;;
        esac

        GRADLE_ARGS="[\"$EXTRA_ARG\""
        for ARG in "${CONFIGURATION_CACHE_ARGS[@]}"; do
          GRADLE_ARGS="$GRADLE_ARGS, \"$ARG\""
        done
        for ARG in "${PROJECT_ISOLATION_ARGS[@]}"; do
          GRADLE_ARGS="$GRADLE_ARGS, \"$ARG\""
        done
        GRADLE_ARGS="$GRADLE_ARGS, \"-Dscan.tag.${{ inputs.experiment-id }}_${{ inputs.variant-prefix }}${{ inputs.variant }}\", \"-Dscan.tag.experiment\", \"-Dscan.tag.${{ inputs.experiment-id }}\"]"

        # Gradle Profiler: cleanup-tasks run between iterations; [] = incremental re-runs
        if [ "${{ inputs.clean-between-iterations }}" = "true" ]; then
          CLEANUP_TASKS='["clean"]'
        else
          CLEANUP_TASKS='[]'
        fi

        # Generate scenario file based on provided inputs
        if [ -z "${{ inputs.class }}" ]; then
          echo "assemble {
            title = \"assemble\"
            tasks = [\"${{ inputs.task }}\"]
            cleanup-tasks = $CLEANUP_TASKS
            gradle-args = $GRADLE_ARGS
          }" > scenario
        else
          echo "assemble {
            title = \"assemble\"
            tasks = [\"${{ inputs.task }}\"]
            cleanup-tasks = $CLEANUP_TASKS
            apply-abi-change-to = [${{ inputs.class }}]
            gradle-args = $GRADLE_ARGS
          }" > scenario
        fi 

        # Execute the Gradle Profiler
        gradle-profiler-0.23.0/bin/gradle-profiler --benchmark --scenario-file scenario assemble --warmups ${{ inputs.warmups }} --iterations ${{ inputs.iterations }}

        # Generate table output from benchmark results
        TABLE_OUTPUT="<table><tr><td>Build</td><td>Time</td></tr>"
        while read line; do
          IFS="," read -r -a Array <<< "$line"
          TABLE_OUTPUT="$TABLE_OUTPUT<tr><td>${Array[0]}</td><td>${Array[1]}</td></tr>"
        done < <(tail -n +2 profile-out/benchmark.csv)
        echo "$TABLE_OUTPUT</table>" >> $GITHUB_STEP_SUMMARY
      shell: bash
      env:
        DEVELOCITY_ACCESS_KEY: ${{ inputs.api-key }}
        CI_URL_CACHE_NODE: ${{ inputs.cache-url }}

    - name: Sanitize variant name
      id: sanitize
      run: |
        VARIANT="${{ inputs.variant }}"
        SAFE_VARIANT="${VARIANT//\//-}"
        echo "safe_variant=$SAFE_VARIANT" >> $GITHUB_OUTPUT
      shell: bash  
  
    - name: Archive Profiler Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: profiler-${{ inputs.variant-prefix }}${{ steps.sanitize.outputs.safe_variant }}
        path: |
          profile-out/*
