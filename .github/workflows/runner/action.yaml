name: 'Experiment Runner'

inputs:
  task:
    description: 'The Gradle task to execute'
    required: true
  variant:
    description: 'The variant to use for the experiment'
    required: true
  variant-prefix:
    description: 'Prefix for the variant used in tagging'
    required: true
  experiment-id:
    description: 'Unique identifier for the experiment'
    required: true
  api-key:
    description: 'API key for accessing Develocity or related services'
    required: true
  repository:
    description: 'GitHub repository to check out'
    required: true
  jdk_version:
    description: 'Java version to use (default is 17)'
    required: false
    default: 17
  jdk_vendor:
    description: 'JDK vendor to use (default is zulu)'
    required: false
    default: 'zulu'
  execution-number:
    description: 'Execution number used for caching purposes'
    required: true
  mode:
    description: 'Mode of execution relative to caching'
    required: true
  configuration-cache:
    description: 'Gradle configuration cache behavior: off, disabled, on, on-no-entry, warn, warn-no-entry, read-only, or read-only-no-entry.'
    required: false
    default: 'off'
  project-isolation:
    description: 'Gradle Isolated Projects behavior: off, on, on-no-entry, diagnostics, or diagnostics-no-entry.'
    required: false
    default: 'off'
  configuration-cache-key:
    description: 'Cache key used to restore the seeded project configuration cache.'
    required: false
  configuration-cache-included-builds:
    description: 'Comma-separated included build paths whose build outputs are required by the configuration cache.'
    required: false
    default: 'buildSrc,build-logic,build-logic/*'
  gradle-encryption-key:
    description: 'Stable Gradle configuration cache encryption key shared by seed and execution jobs.'
    required: false
  extra-args:
    description: 'Extra arguments to pass to the Gradle command'
    required: true
  cache-url:
    description: 'URL for the cache node if applicable'
    required: false
  cache-excludes:
    description: 'Patterns to exclude from cache'
    required: true
  enable_cpu_diagnostics:
    description: 'Collect CPU and system diagnostics'
    required: false
    default: 'false'
  enable_jfr:
    description: 'Collect JVM Flight Recorder recordings'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Stage Configuration Cache Path Helper
      run: cp "${{ github.action_path }}/../lib/configuration-cache-paths.sh" "$RUNNER_TEMP/configuration-cache-paths.sh"
      shell: bash

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.variant }}

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: ${{ inputs.jdk_vendor }}
        java-version: ${{ inputs.jdk_version }}

    - name: Setup Gradle (Cache Mode)
      if: github.event.inputs.mode != 'no caching'
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: true
        add-job-summary: 'never'
        gradle-home-cache-excludes: ${{ inputs.cache-excludes }}
      env:
        GRADLE_BUILD_ACTION_CACHE_KEY_JOB: 'seed'
        GRADLE_BUILD_ACTION_CACHE_KEY_JOB_INSTANCE: ${{ inputs.execution-number }}-${{ inputs.variant }}

    - name: Set Gradle Feature State
      id: gradle-feature-state
      run: |
        feature_enabled=false
        entry_mode=skip
        no_entry=false

        case "${{ inputs.configuration-cache }}" in
          "off"|"disabled"|"")
            ;;
          "on"|"warn"|"read-only")
            feature_enabled=true
            entry_mode=restore
            ;;
          "on-no-entry"|"warn-no-entry"|"read-only-no-entry")
            feature_enabled=true
            no_entry=true
            ;;
          *)
            echo "Unknown configuration cache option: ${{ inputs.configuration-cache }}"
            exit 1
            ;;
        esac

        case "${{ inputs.project-isolation }}" in
          "off"|"")
            ;;
          "on"|"diagnostics")
            feature_enabled=true
            entry_mode=restore
            ;;
          "on-no-entry"|"diagnostics-no-entry")
            feature_enabled=true
            no_entry=true
            ;;
          *)
            echo "Unknown project isolation option: ${{ inputs.project-isolation }}"
            exit 1
            ;;
        esac

        if [ "$no_entry" = true ]; then
          entry_mode=skip
        fi

        echo "feature_enabled=$feature_enabled" >> "$GITHUB_OUTPUT"
        echo "entry_mode=$entry_mode" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: Validate Configuration Cache Encryption Key
      if: steps.gradle-feature-state.outputs.feature_enabled == 'true'
      run: |
        if [ -z "$CHECK_GRADLE_ENCRYPTION_KEY" ]; then
          echo "GRADLE_ENCRYPTION_KEY is required when configuration cache or project isolation is enabled."
          exit 1
        fi
      shell: bash
      env:
        CHECK_GRADLE_ENCRYPTION_KEY: ${{ inputs.gradle-encryption-key }}

    - name: Validate Gradle Feature Combination
      run: |
        if [ "${{ inputs.configuration-cache }}" = "disabled" ] && [ "${{ inputs.project-isolation }}" != "off" ] && [ -n "${{ inputs.project-isolation }}" ]; then
          echo "configuration-cache=disabled cannot be combined with project-isolation=${{ inputs.project-isolation }}."
          echo "Gradle requires configuration cache when Isolated Projects is enabled."
          exit 1
        fi
      shell: bash

    - name: Set Configuration Cache Paths
      id: configuration-cache-paths
      if: steps.gradle-feature-state.outputs.entry_mode == 'restore' && steps.gradle-feature-state.outputs.feature_enabled == 'true' && inputs.configuration-cache-key != '' && inputs.mode != 'no caching'
      run: bash "$RUNNER_TEMP/configuration-cache-paths.sh"
      shell: bash
      env:
        INCLUDED_BUILDS_RAW: ${{ inputs.configuration-cache-included-builds }}

    - uses: cdsap/build-process-watcher@v0.6.2
      with:
        remote_monitoring: 'true'
        export_to_bigquery: 'true'

    - name: Restore Configuration Cache
      id: restore-configuration-cache
      if: steps.gradle-feature-state.outputs.entry_mode == 'restore' && steps.gradle-feature-state.outputs.feature_enabled == 'true' && inputs.configuration-cache-key != '' && inputs.mode != 'no caching'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.configuration-cache-paths.outputs.paths }}
        key: ${{ inputs.configuration-cache-key }}
        fail-on-cache-miss: true

    - name: Set Configuration Cache Arguments
      id: configuration-cache-args
      run: |
        case "${{ inputs.configuration-cache }}" in
          "off"|"")
            echo "args=" >> "$GITHUB_OUTPUT"
            ;;
          "disabled")
            echo "args=--no-configuration-cache -Dorg.gradle.unsafe.isolated-projects=false" >> "$GITHUB_OUTPUT"
            ;;
          "on"|"on-no-entry")
            echo "args=--configuration-cache" >> "$GITHUB_OUTPUT"
            ;;
          "warn"|"warn-no-entry")
            echo "args=--configuration-cache --configuration-cache-problems=warn" >> "$GITHUB_OUTPUT"
            ;;
          "read-only"|"read-only-no-entry")
            echo "args=--configuration-cache -Dorg.gradle.configuration-cache.read-only=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unknown configuration cache option: ${{ inputs.configuration-cache }}"
            exit 1
            ;;
        esac
      shell: bash

    - name: Set Project Isolation Arguments
      id: project-isolation-args
      run: |
        case "${{ inputs.project-isolation }}" in
          "off"|"")
            echo "args=" >> "$GITHUB_OUTPUT"
            ;;
          "on"|"on-no-entry")
            echo "args=--isolated-projects" >> "$GITHUB_OUTPUT"
            ;;
          "diagnostics"|"diagnostics-no-entry")
            echo "args=--isolated-projects -Dorg.gradle.unsafe.isolated-projects.diagnostics=true" >> "$GITHUB_OUTPUT"
            ;;
          *)
            echo "Unknown project isolation option: ${{ inputs.project-isolation }}"
            exit 1
            ;;
        esac
      shell: bash
    - name: Start CPU diagnostics
      if: ${{ inputs.enable_cpu_diagnostics == 'true' }}
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq sysstat

        mkdir -p diagnostics

        nohup bash -c '
          while true; do
            echo "=== $(date --iso-8601=seconds) ==="
            for f in \
              /proc/pressure/cpu \
              /proc/pressure/memory \
              /sys/fs/cgroup/cpu.stat \
              /sys/fs/cgroup/memory.events
            do
              if [ -r "$f" ]; then
                echo "--- $f"
                cat "$f"
              fi
            done
            sleep 1
          done
        ' > diagnostics/pressure.log 2>&1 < /dev/null &
        echo $! > diagnostics/pressure.pid

        nohup pidstat -u -r -h -p ALL 1 \
          > diagnostics/processes.log 2>&1 < /dev/null &
        echo $! > diagnostics/pidstat.pid

        nohup vmstat 1 \
          > diagnostics/system.log 2>&1 < /dev/null &
        echo $! > diagnostics/vmstat.pid

    - name: Start JVM JFR monitoring
      if: ${{ inputs.enable_jfr == 'true' }}
      shell: bash
      run: |
        DIR="$RUNNER_TEMP/jfr"
        mkdir -p "$DIR"
        echo "TELLTALE_JFR_DIR=$DIR" >> "$GITHUB_ENV"

        cat > "$RUNNER_TEMP/jfr-controller.sh" <<'EOF'
        #!/usr/bin/env bash
        set -u

        DIR="$RUNNER_TEMP/jfr"
        mkdir -p "$DIR"

        while [[ ! -f "$DIR/stop" ]]; do
          while read -r PID MAIN REST; do
            [[ "$PID" =~ ^[0-9]+$ ]] || continue

            TYPE=""
            case "$MAIN" in
              org.gradle.launcher.daemon.bootstrap.GradleDaemon)
                TYPE="gradle"
                ;;
              org.jetbrains.kotlin.daemon.KotlinCompileDaemon)
                TYPE="kotlin"
                ;;
              *)
                continue
                ;;
            esac

            MARKER="$DIR/$TYPE-$PID.started"
            [[ -e "$MARKER" ]] && continue

            echo "$(date --iso-8601=seconds) Starting JFR for $TYPE PID=$PID" \
              >> "$DIR/processes.log"

            if jcmd "$PID" JFR.start \
                name=telltale \
                settings=profile \
                disk=true \
                maxsize=512m \
                filename="$DIR/$TYPE-$PID.jfr" \
                dumponexit=true \
                > "$DIR/$TYPE-$PID.log" 2>&1; then
              touch "$MARKER"
            fi
          done < <(jcmd -l 2>/dev/null)

          sleep 1
        done
        EOF

        chmod +x "$RUNNER_TEMP/jfr-controller.sh"

        nohup "$RUNNER_TEMP/jfr-controller.sh" \
          > "$DIR/controller.log" 2>&1 < /dev/null &
        echo $! > "$DIR/controller.pid"

    - name: Execute Gradle Build
      id: gradle-build
      run: |
        set -o pipefail
        ./gradlew ${{ inputs.task }} ${{ inputs.extra-args }} ${{ steps.configuration-cache-args.outputs.args }} ${{ steps.project-isolation-args.outputs.args }} \
          -Dscan.tag.${{ inputs.experiment-id }}_${{ inputs.variant-prefix }}${{ inputs.variant }} \
          -Dscan.tag."${{ inputs.mode }}" \
          -Dscan.tag.experiment \
          -Dscan.tag.${{ inputs.experiment-id }} \
          2>&1 | tee "$RUNNER_TEMP/telltale-gradle.log"
        if [ "${{ steps.gradle-feature-state.outputs.entry_mode }}" = "restore" ] && [ "${{ inputs.mode }}" != "no caching" ] && [ -n "${{ inputs.configuration-cache-key }}" ]; then
          if ! grep -Eq "Reusing configuration cache|Configuration cache entry reused" "$RUNNER_TEMP/telltale-gradle.log"; then
            echo "Expected a configuration-cache hit after restore."
            exit 1
          fi
        fi
      shell: bash
      env:
        DEVELOCITY_ACCESS_KEY: ${{ inputs.api-key }}
        GRADLE_BUILD_ACTION_CACHE_KEY_JOB: 'seed'
        GRADLE_ENCRYPTION_KEY: ${{ inputs.gradle-encryption-key }}
        CI_URL_CACHE_NODE: ${{ inputs.cache-url }}

    - name: Save JVM JFR recordings
      if: ${{ always() && inputs.enable_jfr == 'true' }}
      shell: bash
      run: |
        DIR="$RUNNER_TEMP/jfr"

        touch "$DIR/stop"

        if [[ -f "$DIR/controller.pid" ]]; then
          kill "$(cat "$DIR/controller.pid")" 2>/dev/null || true
        fi

        for MARKER in "$DIR"/*.started; do
          [[ -e "$MARKER" ]] || continue

          NAME=$(basename "$MARKER" .started)
          PID="${NAME##*-}"

          echo "Saving JFR: $NAME, PID=$PID"

          if kill -0 "$PID" 2>/dev/null; then
            jcmd "$PID" JFR.dump \
              name=telltale \
              filename="$DIR/$NAME.jfr" || true

            jcmd "$PID" JFR.stop \
              name=telltale || true
          fi
        done

        echo "Recorded JVMs:"
        cat "$DIR/processes.log" 2>/dev/null || true

        ls -lh "$DIR"/*.jfr 2>/dev/null || true

    - name: Upload JVM JFR recordings
      if: ${{ always() && inputs.enable_jfr == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: jfr-${{ inputs.variant }}-${{ github.job }}-${{ strategy.job-index }}
        path: ${{ runner.temp }}/jfr/
        retention-days: 7
        if-no-files-found: warn

    - name: Stop diagnostics
      if: ${{ always() && inputs.enable_cpu_diagnostics == 'true' }}
      shell: bash
      run: |
        for file in diagnostics/*.pid; do
          [ -f "$file" ] || continue
          kill "$(cat "$file")" 2>/dev/null || true
        done

    - name: Upload diagnostics
      if: ${{ always() && inputs.enable_cpu_diagnostics == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: cpu-${{ inputs.variant }}-${{ github.job }}-${{ strategy.job-index }}
        path: diagnostics/
        retention-days: 7
        if-no-files-found: warn
