name: 'Experiment Report'
description: 'Generates and archives reports comparing Develocity builds for an experiment.'

inputs:
  api-key:
    description: 'API key for accessing Develocity services'
    required: true
  url:
    description: 'URL of the Develocity server'
    required: true
  task:
    description: 'The task used in the experiment'
    required: true
  max-builds:
    description: 'Maximum number of builds to fetch for the comparison (default is 200)'
    required: false
    default: 200
  experiment-id:
    description: 'Unique identifier for the experiment'
    required: true
  tags:
    description: 'Comma-separated tags to filter the builds for comparison'
    required: true
  profile:
    description: 'Enable or disable profiling during the comparison'
    required: true
  gh_token:
    description: 'GitHub token for authentication'
    required: true
  taskpathreport:
    description: 'Enable or disable task path reporting'
    required: true
  processreport:
    description: 'Enable or disable process reporting'
    required: true
  kotlinreport:
    description: 'Enable or disable Kotlin build reporting'
    required: true
  tasktypereport:
    description: 'Enable or disable task type reporting'
    required: true
  resourceusagereport:
    description: 'Enable or disable resource usage reporting'
    required: true
  onlycacheableoutcome:
    description: 'Enable or disable reporting only for cacheable outcomes'
    required: true
  gcreport:
    description: 'Garbage collection report toggle'
    required: true
    default: false
  thresholdtaskduration:
    description: 'Threshold of task duration for the task path report'
    required: true
    default: 1000
  repository:
    description: 'GitHub repository to check out'
    required: true
  run_id:
    description: 'Run ID'
    required: false
  report-kind:
    description: 'Report kind slug used in experiment-result.json identity (caching, no-caching, profiler)'
    required: false
    default: 'report'
  ber-release:
    description: 'BuildExperimentResults release tag providing --output-json'
    required: false
    default: 'v1.2.0'
  edr-release:
    description: 'ExperimentDiagnosticsReport release tag'
    required: false
    default: 'v0.1.0'
  mode:
    description: 'Mode of the experiment'
    required: false
  experiment_title:
    description: 'Title of the experiment'
    required: false
  open-ai-request: 
    description: 'OpenAI request'
    required: true
    default: false
  open-ai-api-key:
    description: 'OpenAI API key'
    required: false
    default: ""
  deploy_results:
    description: 'Deploy results'
    required: true
    default: false
  deployment-key:
    description: 'Deployment key'
    required: true
    default: ""
  snapshot-label-a:
    description: 'Optional label for variant A in Hugo experiment_snapshot (derived from CSV if empty)'
    required: false
    default: ''
  snapshot-label-b:
    description: 'Optional label for variant B in Hugo experiment_snapshot (derived from CSV if empty)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 21

    - name: Execute CompareGEBuilds
      id: compareBuilds
      run: |
        curl -L "https://github.com/cdsap/ExperimentDiagnosticsReport/releases/download/${{ inputs.edr-release }}/experiment-diagnostics-report" --output experiment-diagnostics-report
        chmod 0757 experiment-diagnostics-report
        curl -L "https://github.com/cdsap/BuildExperimentResults/releases/download/${{ inputs.ber-release }}/build-experiment-results" --output build-experiment-results
        chmod 0757 build-experiment-results

        DIAG_FLAGS=""
        if [ -n "${{ inputs.run_id }}" ]; then
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if GITHUB_TOKEN="${{ inputs.gh_token }}" ./experiment-diagnostics-report report \
            --owner "$OWNER" \
            --repo "$REPO" \
            --run-id "${{ inputs.run_id }}" \
            --output diagnostics-package.json \
            --force; then
            DIAG_FLAGS="--diagnostics-package diagnostics-package.json"
          else
            echo "::warning::ExperimentDiagnosticsReport produced no package; continuing without diagnostics"
          fi
        fi

        # Parse and format tags input into the required format
        tags="${{ inputs.tags }}"
        arrayTags=(${tags//,/ })
        tagsParsed=""
        for val in "${arrayTags[@]}"; do
          tagsParsed="$tagsParsed --variants=$val"
        done

        # Set optional flags based on input values
        profile=""
        if [ "${{ inputs.profile }}" == "true" ]; then
          profile="--profile"
        fi

        taskpathreport="--task-path-report"
        if [ "${{ inputs.taskpathreport }}" == "false" ]; then
          taskpathreport="--no-task-path-report"
        fi

        processreport="--process-report"
        if [ "${{ inputs.processreport }}" == "false" ]; then
          processreport="--no-process-report"
        fi

        kotlinreport="--kotlin-build-report"
        if [ "${{ inputs.kotlinreport }}" == "false" ]; then
          kotlinreport="--no-kotlin-build-report"
        fi

        tasktypereport="--task-type-report"
        if [ "${{ inputs.tasktypereport }}" == "false" ]; then
          tasktypereport="--no-task-type-report"
        fi

        resourceusagereport="--resource-usage-report"
        if [ "${{ inputs.resourceusagereport }}" == "false" ]; then
          resourceusagereport="--no-resource-usage-report"
        fi

        onlycacheableoutcome="--only-cacheable-outcome"
        if [ "${{ inputs.onlycacheableoutcome }}" == "false" ]; then
          onlycacheableoutcome="--no-only-cacheable-outcome"
        fi

        gcreport="--gc-report"  
        if [ "${{ inputs.gcreport }}" == "false" ]; then
          gcreport="--no-gc-report"
        fi 

        # OpenAI analysis is only useful when results are deployed to gh-pages.
        # Avoid unnecessary API calls when deploy_results is false.
        if [ "${{ inputs.open-ai-request }}" == "true" ] && [ "${{ inputs.deploy_results }}" == "true" ]; then
          openai_request="--open-ai-request"
        else
          openai_request="--no-open-ai-request"
        fi

        if [ "${{ inputs.open-ai-api-key }}" != "" ]; then
          openai_api_key="--open-ai-key ${{ inputs.open-ai-api-key }}"
        else
          openai_api_key=""
        fi

        thresholdtaskduration="--threshold-task-duration ${{ inputs.thresholdtaskduration }}"

        # Execute the comparison with the appropriate arguments
        URL="${{ inputs.url }}"
        MAX_BUILDS="${{ inputs.max-builds }}"
        REPOSITORY="${{ inputs.repository }}"
        EXPERIMENT_ID="${{ inputs.experiment-id }}"
        RUN_ID="${{ inputs.run_id }}"
        API_KEY="${{ inputs.api-key }}"
     
        TITLE_ARGS=()
        if [ -n "${{ inputs.experiment_title }}" ]; then
          TITLE_ARGS+=(--report-title "${{ inputs.experiment_title }}")
        fi

        ./build-experiment-results --url="$URL" \
          $tasktypereport $resourceusagereport $onlycacheableoutcome $taskpathreport $processreport \
          $kotlinreport $thresholdtaskduration $profile $openai_request $openai_api_key \
          $gcreport --max-builds="$MAX_BUILDS" $tagsParsed \
          --repository="$REPOSITORY" \
          --experiment-id="$EXPERIMENT_ID" \
          --experiment-run-id="$RUN_ID" \
          --run-attempt="${{ github.run_attempt }}" \
          --report-kind="${{ inputs.report-kind }}" \
          --output-json=experiment-result.json \
          $DIAG_FLAGS \
          "${TITLE_ARGS[@]}" \
          --api-key="$API_KEY"

        # Output the results to the GitHub step summary
        CONTENT=$(cat experiment_results_summary_gha)
        echo "$CONTENT" >> $GITHUB_STEP_SUMMARY
      shell: bash

    - name: Generate Hugo experiment_snapshot YAML
      run: |
        set -euo pipefail
        CSV=""
        shopt -s nullglob
        # Prefer the full CSV; ignore *_filtered.csv (often sorts first alphabetically).
        for f in experiment_results_*.csv; do
          [[ "$f" == *filtered* ]] && continue
          CSV="$f"
          break
        done
        if [[ -z "$CSV" ]]; then
          for f in experiment_results_*.csv; do CSV="$f"; break; done
        fi
        if [[ -z "$CSV" && -f build_comparison.csv ]]; then CSV=build_comparison.csv; fi
        if [[ -z "$CSV" ]]; then
          echo "::error::No experiment_results_*.csv or build_comparison.csv in workspace — cannot build experiment_snapshot"
          ls -la
          exit 1
        fi
        ARGS=()
        if [[ -n "${{ inputs.snapshot-label-a }}" ]]; then ARGS+=(--label-a "${{ inputs.snapshot-label-a }}"); fi
        if [[ -n "${{ inputs.snapshot-label-b }}" ]]; then ARGS+=(--label-b "${{ inputs.snapshot-label-b }}"); fi
        echo "Using CSV for experiment_snapshot: ${CSV}"
        python3 scripts/experiment_snapshot_from_csv.py "${ARGS[@]}" "$CSV" | tee experiment_snapshot.yaml
      shell: bash

    - name: Archive Comparison Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-comparison-reports-${{ inputs.report-kind }}
        path: |
          experiment_results*
          experiment-result.json
          diagnostics-package.json
          experiment_snapshot.yaml
          *.csv
        if-no-files-found: error

    - name: Setup Node
      if: ${{ inputs.deploy_results == 'true' }}
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: web/report-viewer/package-lock.json

    - name: Build report viewer
      if: ${{ inputs.deploy_results == 'true' }}
      shell: bash
      working-directory: web/report-viewer
      run: |
        set -euo pipefail
        npm ci
        npm run build
        mkdir -p "$RUNNER_TEMP/telltale-publish"
        cp -a dist "$RUNNER_TEMP/telltale-publish/viewer-dist"
        cp -a "${{ github.workspace }}/web/hugo/layouts" "$RUNNER_TEMP/telltale-publish/hugo-layouts"
        cp "${{ github.workspace }}/scripts/stage_published_report.py" "$RUNNER_TEMP/telltale-publish/"

    - name: Checkout gh-pages branch
      uses: actions/checkout@v4
      with:
        ref: gh-pages
        path: .
        fetch-depth: 0

    - name: Download experiment results
      uses: actions/download-artifact@v4
      with:
        name: build-comparison-reports-${{ inputs.report-kind }}
        path: temp-results

    - name: Update gh-pages content
      if: ${{ inputs.deploy_results == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        TIMESTAMP=$(date -u +%Y-%m-%d)
        if [ "${{ inputs.experiment_title }}" != "" ]; then
          EXPERIMENT_TITLE="${{ inputs.experiment_title }}"
        else
          EXPERIMENT_TITLE="${{ inputs.repository }}-${{ inputs.task }}"
        fi
        VARIANTS="${{ inputs.tags }}"
        EXPERIMENT_ID="${{ inputs.experiment-id }}"
        SUMMARY="\"variants: ${VARIANTS//${EXPERIMENT_ID}_/}\""
        PROFILE_FLAG=()
        if [ "${{ inputs.profile }}" == "true" ]; then
          PROFILE_FLAG=(--profile)
        fi
        python3 "$RUNNER_TEMP/telltale-publish/stage_published_report.py" \
          --results temp-results \
          --site . \
          --viewer-dist "$RUNNER_TEMP/telltale-publish/viewer-dist" \
          --layouts-src "$RUNNER_TEMP/telltale-publish/hugo-layouts" \
          --site-base /Telltale \
          --experiment-id "${{ inputs.experiment-id }}" \
          --report-kind "${{ inputs.report-kind }}" \
          --date "$TIMESTAMP" \
          --title "$EXPERIMENT_TITLE" \
          --summary "$SUMMARY" \
          --mode "${{ inputs.mode }}" \
          "${PROFILE_FLAG[@]}" | tee "$RUNNER_TEMP/telltale-publish/staged.json"
        {
          echo "## Published report"
          echo
          echo '```json'
          cat "$RUNNER_TEMP/telltale-publish/staged.json"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Push Experiment Results
      if: ${{ inputs.deploy_results == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add content static/reports
        [[ -d static/data ]] && git add static/data
        [[ -d static/experiments ]] && git add static/experiments
        [[ -d static/assets/report-viewer ]] && git add static/assets/report-viewer
        [[ -f layouts/partials/report-link.html ]] && git add layouts/partials/report-link.html
        [[ -f layouts/index.experimentsjson.json ]] && git add layouts/index.experimentsjson.json
        if git diff --cached --quiet; then
          echo "No publication changes to commit"
          exit 0
        fi
        git commit -m "Add experiment results for ${{ inputs.experiment-id }} (${{ inputs.report-kind }})"
        REMOTE="https://x-access-token:${{ inputs.gh_token }}@github.com/cdsap/Telltale.git"
        for i in 1 2 3 4 5 6; do
          git pull --rebase "$REMOTE" gh-pages
          if git push "$REMOTE" gh-pages; then
            exit 0
          fi
          echo "gh-pages push failed (attempt $i); retrying"
          sleep $((i * 5))
        done
        echo "::error::Failed to push gh-pages after retries; leaving the branch unchanged by not force-pushing"
        exit 1

    - name: Trigger gh-pages workflow
      if: ${{ inputs.deploy_results == 'true' }}
      shell: bash    
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: token ${{ inputs.deployment-key }}" \
          https://api.github.com/repos/cdsap/Telltale/dispatches \
          -d '{"event_type": "deploy-hugo", "client_payload": {"ref": "gh-pages"}}'
  
